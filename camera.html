<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Photo Movie</title>
    <style>
        :root { --bg: #0E1A25; --accent: #69829E; }
        body { margin: 0; background: var(--bg); font-family: sans-serif; overflow: hidden; color: #fff; }
        #app { position: relative; width: 100vw; height: 100vh; }
        
        video { width: 100%; height: 100%; object-fit: cover; background: #000; }
        .mirror { transform: scaleX(-1); }

        #moldura-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; object-fit: fill; }
        
        .header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; }
        #timer-display { font-size: 40px; font-weight: bold; color: #ff4444; text-shadow: 2px 2px 5px #000; display: none; }

        .controls { position: absolute; bottom: 100px; width: 100%; display: flex; justify-content: space-around; align-items: center; z-index: 10; }
        .btn { width: 65px; height: 65px; border-radius: 50%; border: 2px solid var(--accent); background: rgba(0,0,0,0.6); color: white; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .shutter { width: 90px; height: 90px; border: 5px solid #fff; background: transparent; }

        #loader { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .spin { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: rotate 1s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        
        #mirror-toggle { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px; z-index: 20; font-size: 12px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div id="app">
        <div id="mirror-toggle" onclick="toggleMirror()">ESPELHO: LIGADO</div>
        <div class="header"><div id="timer-display">10s</div></div>

        <video id="preview" autoplay playsinline muted class="mirror"></video>
        <img id="moldura-overlay">

        <div class="controls">
            <div class="btn" onclick="window.location.href='index.html'">✕</div>
            <div class="btn shutter" id="rec-btn"></div>
            <div class="btn" onclick="switchCamera()">🔄</div>
        </div>
    </div>

    <canvas id="recorder-canvas" width="720" height="1280" style="display:none;"></canvas>

    <div id="loader">
        <div class="spin"></div>
        <p>PROCESSANDO...</p>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    const video = document.getElementById('preview');
    const canvas = document.getElementById('recorder-canvas');
    const ctx = canvas.getContext('2d');
    const molduraImg = new Image();
    molduraImg.crossOrigin = "anonymous";

    let stream, recorder, chunks = [];
    let isFront = false, isRec = false, mirror = true;

    function toggleMirror() {
        mirror = !mirror;
        video.className = mirror ? "mirror" : "";
        document.getElementById('mirror-toggle').innerText = mirror ? "ESPELHO: LIGADO" : "ESPELHO: DESLIGADO";
    }

    async function init() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        try {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: isFront ? "user" : "environment", width: 1280, height: 720 }
            });
            video.srcObject = stream;
        } catch (e) { alert("Erro câmera"); }
    }

    function switchCamera() { isFront = !isFront; init(); }

    window.onload = () => {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (config) {
            let path = config.molduraUrl || config.moldura;
            if (path) {
                const url = `${WORKER_URL}/stream?id=${path.includes('id=') ? path.split('id=')[1] : path}`;
                molduraImg.src = url;
                document.getElementById('moldura-overlay').src = url;
                molduraImg.onload = () => document.getElementById('moldura-overlay').style.display = 'block';
            }
        }
        init();
    };

    document.getElementById('rec-btn').onclick = () => {
        if (isRec) return;
        isRec = true;
        document.getElementById('rec-btn').style.background = "red";
        
        chunks = [];
        const config = JSON.parse(localStorage.getItem('config_atual'));
        let time = config ? parseInt(config.tempo) : 10;

        const s = canvas.captureStream(30);
        recorder = new MediaRecorder(s, { mimeType: 'video/webm;codecs=vp8', videoBitsPerSecond: 3000000 });
        
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = upload;
        
        recorder.start();

        const timerUI = document.getElementById('timer-display');
        timerUI.style.display = "block";

        // Loop de desenho
        const draw = () => {
            if (recorder.state === "recording") {
                ctx.clearRect(0, 0, 720, 1280);
                if (mirror) {
                    ctx.save(); ctx.scale(-1, 1);
                    ctx.drawImage(video, -720, 0, 720, 1280);
                    ctx.restore();
                } else {
                    ctx.drawImage(video, 0, 0, 720, 1280);
                }
                if (molduraImg.complete) ctx.drawImage(molduraImg, 0, 0, 720, 1280);
                requestAnimationFrame(draw);
            }
        };
        draw();

        const clock = setInterval(() => {
            time--;
            timerUI.innerText = time + "s";
            if (time <= 0) {
                clearInterval(clock);
                recorder.stop();
            }
        }, 1000);
    };

    async function upload() {
        document.getElementById('loader').style.display = 'flex';
        const config = JSON.parse(localStorage.getItem('config_atual'));
        const event = config ? config.nome.replace(/\s+/g, '_') : "Geral";
        
        const fd = new FormData();
        fd.append("video", new Blob(chunks, { type: 'video/webm' }));
        fd.append("uuid", `vid_${Date.now()}.webm`);
        fd.append("evento", event);

        try {
            const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: fd });
            if (res.ok) window.location.href = 'galeria.html';
            else alert("Erro upload");
        } catch (e) { alert("Erro conexão"); }
        location.reload();
    }
</script>
</body>
</html>
