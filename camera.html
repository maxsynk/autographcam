<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AUTOGRAPH CAM - Estável</title>
    <style>
        :root {
            --bg: #0E1A25;
            --accent: #69829E;
            --white: #EFEEE9;
        }

        body { 
            margin: 0; 
            background: var(--bg); 
            font-family: sans-serif; 
            overflow: hidden; 
            color: var(--white);
        }

        /* Container da Câmera */
        #app {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        /* Classe para espelhar apenas a frontal */
        .mirror { transform: scaleX(-1); }

        /* Moldura sobreposta */
        #moldura-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: none;
        }

        /* Cabeçalho */
        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        #event-name {
            display: block;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        #timer-display {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        /* Controles Inferiores */
        .controls {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: rgba(0,0,0,0.4);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .shutter {
            width: 80px;
            height: 80px;
            border: 4px solid var(--white);
            background: transparent;
        }

        /* Feedback de gravação */
        #recording-dot {
            width: 12px;
            height: 12px;
            background: red;
            border-radius: 50%;
            display: none;
            margin: 0 auto 5px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

        /* Overlay de Loading */
        #loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spin {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: rotate 1s linear infinite;
        }

        @keyframes rotate { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div id="recording-dot"></div>
            <span id="event-name">CARREGANDO...</span>
            <div id="timer-display">10s</div>
        </div>

        <video id="preview" autoplay playsinline muted></video>
        <img id="moldura-overlay">

        <div class="controls">
            <!-- Botão Fechar -->
            <div class="btn" onclick="window.location.href='index.html'">✕</div>
            
            <!-- Botão Gravar -->
            <div class="btn shutter" id="rec-btn"></div>
            
            <!-- Botão Inverter Câmera -->
            <div class="btn" onclick="switchCamera()">🔄</div>
        </div>
    </div>

    <!-- Canvas invisível para processamento -->
    <canvas id="recorder-canvas" width="720" height="1280" style="display:none;"></canvas>

    <div id="loader">
        <div class="spin"></div>
        <p>ENVIANDO VÍDEO...</p>
    </div>

<script>
    const WORKER_URL = "https://photomovie.maxprimefotovideo.workers.dev";
    const video = document.getElementById('preview');
    const canvas = document.getElementById('recorder-canvas');
    const ctx = canvas.getContext('2d');
    const molduraImg = new Image();
    molduraImg.crossOrigin = "anonymous";

    let stream;
    let recorder;
    let chunks = [];
    let isFrontCamera = false;
    let isRecording = false;

    // 1. Iniciar Câmera
    async function initCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        
        const constraints = {
            video: { 
                facingMode: isFrontCamera ? "user" : "environment",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            // Espelha o vídeo apenas se for a câmera frontal
            video.className = isFrontCamera ? "mirror" : "";
        } catch (err) {
            alert("Câmera não disponível");
        }
    }

    // 2. Alternar Câmera
    function switchCamera() {
        if (isRecording) return;
        isFrontCamera = !isFrontCamera;
        initCamera();
    }

    // 3. Carregar Configurações
    window.onload = () => {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (config) {
            document.getElementById('event-name').innerText = config.nome || "AUTOGRAPH CAM";
            let path = config.molduraUrl || config.moldura;
            if (path) {
                const id = path.includes('id=') ? path.split('id=')[1] : path;
                const url = `${WORKER_URL}/stream?id=${id}`;
                molduraImg.src = url;
                document.getElementById('moldura-overlay').src = url;
                molduraImg.onload = () => document.getElementById('moldura-overlay').style.display = 'block';
            }
        }
        initCamera();
    };

    // 4. Lógica de Gravação
    document.getElementById('rec-btn').onclick = async function() {
        if (isRecording) return;
        isRecording = true;
        this.style.opacity = "0.3"; // Desabilita visualmente o botão

        let count = 3;
        const timer = document.getElementById('timer-display');
        timer.style.display = 'block';
        
        // Contagem regressiva para começar
        let countdown = setInterval(() => {
            timer.innerText = `Começa em ${count}...`;
            count--;
            if (count < 0) {
                clearInterval(countdown);
                startMediaRecorder();
            }
        }, 1000);
    };

    function startMediaRecorder() {
        chunks = [];
        const config = JSON.parse(localStorage.getItem('config_atual'));
        const duration = (config ? parseInt(config.tempo) : 10);
        
        const captureStream = canvas.captureStream(30);
        recorder = new MediaRecorder(captureStream, { 
            mimeType: 'video/webm;codecs=vp8',
            videoBitsPerSecond: 3000000 
        });

        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = uploadVideo;

        recorder.start();
        document.getElementById('recording-dot').style.display = 'block';
        
        // Loop de desenho no canvas (Garante que a moldura seja gravada no vídeo)
        const draw = () => {
            if (recorder.state === "recording") {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Desenha o vídeo (Se for frontal, espelha no canvas também)
                if (isFrontCamera) {
                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
                    ctx.restore();
                } else {
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                }

                // Desenha a moldura por cima
                if (molduraImg.complete) {
                    ctx.drawImage(molduraImg, 0, 0, canvas.width, canvas.height);
                }
                requestAnimationFrame(draw);
            }
        };
        draw();

        // Timer da gravação
        let timeLeft = duration;
        const timer = document.getElementById('timer-display');
        let clock = setInterval(() => {
            timeLeft--;
            timer.innerText = `${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(clock);
                recorder.stop();
            }
        }, 1000);
    }

    async function uploadVideo() {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('recording-dot').style.display = 'none';

        const config = JSON.parse(localStorage.getItem('config_atual'));
        const eventFolder = config ? config.nome.replace(/\s+/g, '_') : "Geral";
        
        const blob = new Blob(chunks, { type: 'video/webm' });
        const formData = new FormData();
        formData.append("video", blob);
        formData.append("uuid", `vid_${Date.now()}.webm`);
        formData.append("evento", eventFolder);

        try {
            const res = await fetch(`${WORKER_URL}/upload`, { method: "POST", body: formData });
            if (res.ok) window.location.href = 'galeria.html';
            else alert("Erro ao salvar. Tente novamente.");
        } catch (err) {
            alert("Erro de conexão.");
        }
        document.getElementById('loader').style.display = 'none';
        isRecording = false;
        document.getElementById('rec-btn').style.opacity = "1";
    }
</script>

</body>
</html>
