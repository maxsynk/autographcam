<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CONFIGURAR - AUTOGRAPH CAM</title>
    <style>
        :root { --bg-deep: #0E1A25; --bg-surface: #182232; --accent: #69829E; --text-main: #EFEEE9; }
        body { margin: 0; background: var(--bg-deep); color: var(--text-main); font-family: 'Segoe UI', sans-serif; padding-bottom: 40px; }
        .header { background: #1c2d3d; padding: 35px 25px; text-align: center; border-bottom: 2px solid var(--accent); }
        .header h1 { font-size: 28px; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .section { background: var(--bg-surface); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(105, 130, 158, 0.2); }
        .section h3 { color: var(--accent); font-size: 12px; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid rgba(105, 130, 158, 0.1); padding-bottom: 5px; }
        label { display: block; font-size: 10px; color: var(--accent); margin: 10px 0 5px; font-weight: bold; }
        input { width: 100%; background: #000; border: 1px solid #333; color: white; border-radius: 10px; padding: 12px; outline: none; box-sizing: border-box; }
        .action-box { width: 100%; padding: 20px; background: #000; border: 2px dashed #444; color: #888; border-radius: 15px; text-align: center; cursor: pointer; margin-top: 10px; }
        #frame-preview { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border: 1px solid var(--accent); }
        .btn-save-main { width: 100%; padding: 22px; background: var(--accent); border: none; border-radius: 50px; color: #000; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: var(--bg-surface); padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; }
        .trim-input { width: 70px; text-align: center; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header"><h1>AUTOGRAPH CAM</h1></div>

    <div class="container">
        <input type="hidden" id="conf-id">
        <input type="hidden" id="conf-id-fixo">

        <div class="section">
            <h3>1. Dados do Evento</h3>
            <label>NOME DO EVENTO (Obrigatório)</label>
            <input type="text" id="conf-nome" placeholder="Ex: Festa de Formatura" oninput="gerarIdFixo(this.value)">
            <label>DATA</label>
            <input type="date" id="conf-data">
        </div>

        <div class="section">
            <h3>2. Estética e Áudio (Opcionais)</h3>
            <div class="action-box" onclick="toggleModal('music-modal', true)">
                <span id="music-status-text">🎵 CONFIGURAR MÚSICA</span>
            </div>
            
            <div class="action-box" onclick="document.getElementById('file-moldura').click()">
                <span id="upload-label">📸 UPAR MOLDURA (PNG)</span>
                <input type="file" id="file-moldura" accept="image/png" style="display:none" onchange="subirArquivo(this, 'MOLDURA')">
            </div>
            
            <input type="hidden" id="conf-moldura-url">
            <input type="hidden" id="conf-musica-url">
            <img id="frame-preview">
        </div>

        <button class="btn-save-main" onclick="salvarConfig()">SALVAR CONFIGURAÇÕES</button>
        <p onclick="window.location.href='index.html'" style="text-align:center; color:var(--accent); cursor:pointer; font-size:12px; margin-top:20px; font-weight:bold;">← CANCELAR E VOLTAR</p>
    </div>

    <div id="music-modal" class="modal">
        <div class="modal-content">
            <h4 style="color:var(--accent); text-align:center; margin-top:0;">ESTÚDIO DE ÁUDIO</h4>
            <div class="action-box" onclick="document.getElementById('file-musica').click()">
                <span id="music-file-label">📤 SELECIONAR MP3</span>
                <input type="file" id="file-musica" accept="audio/mpeg, audio/mp3" style="display:none" onchange="subirArquivo(this, 'MUSICA')">
            </div>
            <label style="text-align:center;">INÍCIO DA MÚSICA (MIN : SEG)</label>
            <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
                <input type="number" id="trim-min" class="trim-input" value="0" min="0">
                <span style="font-size:24px;">:</span>
                <input type="number" id="trim-sec" class="trim-input" value="0" min="0" max="59">
            </div>
            <button class="btn-save-main" style="padding:12px;" onclick="toggleModal('music-modal', false)">CONCLUIR</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";

    function gerarIdFixo(v) {
        if(!document.getElementById('conf-id').value) {
            const sanitizado = v.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, '_')
                .replace(/[^\w]/g, '');
            document.getElementById('conf-id-fixo').value = sanitizado;
        }
    }

    window.onload = () => {
        const editData = localStorage.getItem('evento_para_editar');
        if (editData) {
            const ev = JSON.parse(editData);
            document.getElementById('conf-id').value = ev.id || "";
            document.getElementById('conf-id-fixo').value = ev.id_fixo || "";
            document.getElementById('conf-nome').value = ev.nome || "";
            document.getElementById('conf-data').value = ev.data || "";
            document.getElementById('conf-moldura-url').value = ev.molduraUrl || "";
            document.getElementById('conf-musica-url').value = ev.musicaUrl || "";
            
            if(ev.molduraUrl) {
                const img = document.getElementById('frame-preview');
                img.src = `${WORKER_URL}/stream?id=${ev.molduraUrl}`;
                img.style.display = "block";
                document.getElementById('upload-label').innerText = "📸 MOLDURA CARREGADA";
            }
            if(ev.musicaUrl) document.getElementById('music-status-text').innerText = "🎵 MÚSICA CARREGADA";
        }
    };

    function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'flex' : 'none'; }

    async function subirArquivo(input, tipo) {
        let idPasta = document.getElementById('conf-id-fixo').value;
        if (!idPasta) return alert("Por favor, digite o NOME DO EVENTO primeiro.");
        if (!input.files[0]) return;

        const label = tipo === 'MOLDURA' ? document.getElementById('upload-label') : document.getElementById('music-file-label');
        const originalText = label.innerText;
        label.innerText = "⏳ ENVIANDO...";

        const formData = new FormData();
        formData.append("file", input.files[0]);
        formData.append("evento", idPasta);
        formData.append("tipo", tipo.toLowerCase());

        try {
            const res = await fetch(`${WORKER_URL}/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            
            if(data.success) {
                const path = `${idPasta}/${data.filename}`;
                if(tipo === 'MOLDURA') {
                    document.getElementById('conf-moldura-url').value = path;
                    document.getElementById('frame-preview').src = `${WORKER_URL}/stream?id=${path}&t=${Date.now()}`;
                    document.getElementById('frame-preview').style.display = "block";
                    label.innerText = "📸 MOLDURA OK";
                } else {
                    document.getElementById('conf-musica-url').value = path;
                    label.innerText = "✅ MÚSICA OK";
                    document.getElementById('music-status-text').innerText = "🎵 MÚSICA CARREGADA";
                }
            } else { throw new Error(); }
        } catch (e) { 
            alert("Erro ao subir arquivo. Tente novamente."); 
            label.innerText = originalText;
        }
    }

    async function salvarConfig() {
        const config = {
            id: document.getElementById('conf-id').value || String(Date.now()),
            id_fixo: document.getElementById('conf-id-fixo').value,
            nome: document.getElementById('conf-nome').value.trim(),
            data: document.getElementById('conf-data').value,
            molduraUrl: document.getElementById('conf-moldura-url').value || "",
            musicaUrl: document.getElementById('conf-musica-url').value || "",
            musicaTrim: String(parseInt(document.getElementById('trim-min').value || 0)*60 + parseInt(document.getElementById('trim-sec').value || 0)),
            modoVideo: "linear" // Informação para o processador: corre direto
        };

        if(!config.nome) return alert("O Nome do Evento é obrigatório!");

        try {
            const res = await fetch(`${WORKER_URL}/salvar-evento`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(config)
            });

            if(res.ok) {
                localStorage.removeItem('evento_para_editar');
                alert("Configurações salvas com sucesso!");
                window.location.href = 'index.html';
            } else { alert("Erro ao salvar no servidor."); }
        } catch (e) { alert("Erro de conexão."); }
    }
</script>
</body>
</html>
