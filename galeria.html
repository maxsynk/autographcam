<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <!-- Essencial para o download funcionar em todos os celulares -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER E ATALHO DE SAÍDA */
        .header {
            margin-top: 1.2cm;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
            user-select: none;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            color: var(--accent);
            font-size: 18px;
            margin: -5px 0 0 0;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: lowercase;
            opacity: 0.9;
        }

        #nome-evento-banner {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        /* BUSCA POR NÚMERO */
        .search-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .search-container input {
            width: 100%;
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        /* GRADE DE VÍDEOS */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 94%;
            max-width: 1100px;
            padding-bottom: 60px;
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            border: 1px solid rgba(105, 130, 158, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* NÚMERO DO VÍDEO (#) */
        .video-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
            border: 1px solid var(--accent);
        }

        /* BOTÃO DOWNLOAD NA GRADE */
        .btn-download-grid {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: bold;
            z-index: 5;
            font-size: 18px;
        }

        /* MODAL DE ZOOM */
        #modal-zoom {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(10px);
        }

        #media-full {
            width: 85%;
            max-height: 70vh;
            border-radius: 15px;
            border: 2px solid var(--accent);
        }

        .modal-controls {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn-action {
            padding: 15px 35px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-close { background: #333; color: white; }
        .btn-download-full { background: var(--accent); color: white; }

        .empty-msg { grid-column: 1/-1; text-align: center; padding: 50px; color: var(--text-dim); }
    </style>
</head>
<body onload="sincronizarInterface()">

    <div class="header" id="logo-exit">
        <h1>AUTOGRAPH CAM</h1>
        <p>colecionando momentos</p>
        <div id="nome-evento-banner">CONECTANDO...</div>
    </div>

    <div class="search-container">
        <input type="number" id="input-busca" placeholder="Digite o número do vídeo..." oninput="iniciarBuscaInteligente()">
    </div>

    <div id="grade-videos" class="grid-videos">
        <!-- Vídeos via JS -->
    </div>

    <!-- MODAL ZOOM -->
    <div id="modal-zoom">
        <video id="media-full" controls playsinline crossorigin="anonymous"></video>
        <div class="modal-controls">
            <button class="btn-action btn-close" onclick="fecharZoom()">VOLTAR</button>
            <button id="btn-download-force" class="btn-action btn-download-full">BAIXAR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let cliquesSaida = 0;
    let timerBusca;

    // Atalho secreto: 7 cliques volta para index
    document.getElementById('logo-exit').onclick = () => {
        if (++cliquesSaida >= 7) window.location.href = 'index.html';
        setTimeout(() => { cliquesSaida = 0; }, 3000);
    };

    // Busca inteligente: espera 3s e abre o zoom
    function iniciarBuscaInteligente() {
        clearTimeout(timerBusca);
        const termo = document.getElementById('input-busca').value.trim();
        
        if (termo.length > 0) {
            timerBusca = setTimeout(() => {
                // Como a lista é "mais recentes primeiro", calculamos o número real
                const total = listaArquivosAtuais.length;
                const index = total - parseInt(termo);
                
                if (listaArquivosAtuais[index]) {
                    const file = listaArquivosAtuais[index];
                    const streamUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
                    abrirZoom(streamUrl, file.path);
                }
            }, 3000);
        }
    }

    async function sincronizarInterface() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento') || (JSON.parse(localStorage.getItem('config_atual')) || {nome: "Geral"}).nome;
        
        document.getElementById('nome-evento-banner').innerText = "Evento: " + eventoID.toUpperCase().replace(/_/g, ' ');

        try {
            // Rota exata do seu Worker
            const res = await fetch(`${WORKER_URL}/listar-videos-evento?evento=${encodeURIComponent(eventoID)}&t=${Date.now()}`);
            const dados = await res.json();

            // Evita ficar renderizando se nada mudou
            if (JSON.stringify(dados) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = dados;
                renderizar(dados);
            }
        } catch (e) {
            console.error("Erro ao listar:", e);
        }
    }

    function renderizar(arquivos) {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';

        if (!arquivos || arquivos.length === 0) {
            container.innerHTML = `<div class="empty-msg">Nenhum vídeo processado ainda...</div>`;
            return;
        }

        arquivos.forEach((file, index) => {
            // Rota de Stream do seu Worker
            const streamUrl = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            const numExibicao = arquivos.length - index;

            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-number">#${numExibicao}</div>
                <video src="${streamUrl}#t=0.5" preload="metadata" muted playsinline onclick="abrirZoom('${streamUrl}', '${file.path}')"></video>
                <a href="javascript:void(0)" onclick="forçarDownload('${streamUrl}', '${file.path}')" class="btn-download-grid">↓</a>
            `;
            container.appendChild(card);
        });
    }

    function abrirZoom(url, path) {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        modal.style.display = 'flex';
        video.src = url;
        video.play();

        document.getElementById('btn-download-force').onclick = () => forçarDownload(url, path);
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        video.pause();
        video.src = "";
        modal.style.display = 'none';
        document.getElementById('input-busca').value = '';
    }

    // Função de download robusta usando FileSaver
    function forçarDownload(url, path) {
        const fileName = path.split('/').pop();
        fetch(url)
            .then(res => res.blob())
            .then(blob => {
                saveAs(blob, fileName);
            })
            .catch(err => alert("Erro ao baixar vídeo."));
    }

    // Monitora novos vídeos a cada 8 segundos
    setInterval(sincronizarInterface, 8000);
</script>
</body>
</html>
