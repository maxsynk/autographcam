<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 30px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }

        #nome-evento-titulo {
            color: var(--accent);
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 4px;
            margin: 0;
            text-transform: uppercase;
        }

        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 92%;
            max-width: 1000px;
            padding: 20px 0;
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            border: 1px solid rgba(105, 130, 158, 0.1);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-download {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-dim);
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="nome-evento-titulo">CARREGANDO...</h1>
    </div>

    <div id="grade-videos" class="grid-videos">
        <!-- Vídeos entram aqui via JS -->
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let nomeEventoGlobal = "";

    // Função para limpar o nome (exatamente como no Index)
    function limparNome(nome) {
        return nome
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, '_');
    }

    async function sincronizarInterface() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento');

        // Se não houver na URL, tenta pegar do localStorage (evento ativo no tablet/PC)
        if (!eventoID) {
            const configLocal = JSON.parse(localStorage.getItem('config_atual'));
            if (configLocal) {
                eventoID = configLocal.nome;
            }
        }

        if (!eventoID) {
            document.getElementById('nome-evento-titulo').innerText = "NENHUM EVENTO ATIVO";
            return;
        }

        // 1. Limpa o nome para buscar no R2
        const pastaR2 = limparNome(eventoID);
        nomeEventoGlobal = pastaR2;

        // 2. Atualiza o Título na tela
        document.getElementById('nome-evento-titulo').innerText = eventoID.toUpperCase().replace(/_/g, ' ');

        try {
            // 3. Busca a lista de vídeos no Worker
            const response = await fetch(`${WORKER_URL}/listar-videos-evento?evento=${encodeURIComponent(pastaR2)}&t=${Date.now()}`);
            const novosArquivos = await response.json();

            // Só renderiza se houver mudança na lista
            if (JSON.stringify(novosArquivos) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = novosArquivos;
                renderizar(novosArquivos);
            }
        } catch (e) {
            console.error("Erro ao buscar vídeos:", e);
        }
    }

    function renderizar(arquivos) {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';

        if (!arquivos || arquivos.length === 0) {
            container.innerHTML = `<div class="empty-msg">Nenhum vídeo encontrado para este evento ainda.</div>`;
            return;
        }

        arquivos.forEach(file => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            // Link direto para o vídeo no seu R2/Worker
            const videoUrl = `${WORKER_URL}/ver-video?file=${encodeURIComponent(file.key)}`;

            card.innerHTML = `
                <video src="${videoUrl}" preload="metadata" muted playsinline></video>
                <a href="${videoUrl}" download class="btn-download">BAIXAR</a>
            `;

            // Play/Pause simples ao tocar
            card.onclick = () => {
                const v = card.querySelector('video');
                v.paused ? v.play() : v.pause();
            };

            container.appendChild(card);
        });
    }

    // Inicia e fica verificando novos vídeos a cada 10 segundos
    sincronizarInterface();
    setInterval(sincronizarInterface, 10000);

</script>
</body>
</html>
