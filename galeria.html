<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --bg: #0E1A25; --surface: #182232; --accent: #69829E; --text: #EFEEE9; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; }
        
        /* Ajuste no Header para suportar subtítulo */
        .header { padding: 30px 20px 10px 20px; cursor: pointer; }
        .header h1 { font-size: 32px; letter-spacing: 4px; margin: 0; text-transform: uppercase; }
        .subtitle { font-size: 11px; letter-spacing: 4px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; color: var(--accent); }
        
        /* Container do Nome do Evento (Estilo Admin) */
        .event-info-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 15px 20px;
        }
        .v-line { width: 2px; height: 30px; background: var(--accent); border-radius: 2px; margin-right: 10px; }
        #nome-evento { 
            color: var(--accent); 
            font-size: 13px; 
            margin: 0; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            font-weight: bold;
            text-align: left;
        }

        /* Área de Busca (Igual Admin) */
        .search-area { 
            padding: 15px; 
            background: rgba(0,0,0,0.3); 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 10px;
        }
        .search-area input { 
            width: 180px; 
            padding: 12px; border-radius: 8px; 
            border: 1px solid var(--accent); background: #000; color: var(--accent); 
            text-align: center; font-weight: bold; outline: none; font-size: 18px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; 
        }
        
        .card { 
            background: var(--surface); border-radius: 12px; overflow: hidden; 
            aspect-ratio: 9/16; position: relative; border: 1px solid rgba(105, 130, 158, 0.2); 
        }
        
        .card video { width: 100%; height: 100%; object-fit: cover; }
        .num { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

        /* MODAL */
        #modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        #vid-full { width: 90%; max-height: 70vh; border-radius: 10px; }
        .btns { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 15px 25px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn-dl { background: var(--accent); color: white; }
    </style>
</head>
<body>

    <div class="header" onclick="contarCliquesSair()">
        <h1>AUTOGRAPH CAM</h1>
        <div class="subtitle">colecionando momentos</div>
    </div>

    <div class="event-info-container">
        <div class="v-line"></div>
        <div id="nome-evento">Carregando...</div>
    </div>

    <div class="search-area">
        <input type="number" id="input-busca" placeholder="Nº VÍDEO" oninput="timerBusca()">
    </div>

    <div id="grid" class="grid"></div>

    <div id="modal">
        <video id="vid-full" controls playsinline></video>
        <div class="btns">
            <button class="btn" onclick="fechar()">VOLTAR</button>
            <button id="btn-save" class="btn btn-dl">BAIXAR</button>
        </div>
    </div>

<script>
    const WORKER = "https://autographcam.maxprimefotovideo.workers.dev";
    let ultimaLista = "";
    let listaFinaisCache = []; // Para busca rápida
    let cliquesSaida = 0;
    let tempoBusca;

    // Função para sair após 7 cliques no título
    function contarCliquesSair() {
        cliquesSaida++;
        if (cliquesSaida >= 7) {
            window.location.href = 'index.html';
        }
        setTimeout(() => { cliquesSaida = 0; }, 3000); // Reseta se demorar muito entre cliques
    }

    // Função de Timer para Busca (3 segundos)
    function timerBusca() {
        clearTimeout(tempoBusca);
        const valor = document.getElementById('input-busca').value;
        if (valor) {
            tempoBusca = setTimeout(() => {
                executarBusca(valor);
            }, 3000);
        }
    }

    function executarBusca(num) {
        const index = parseInt(num) - 1;
        if (listaFinaisCache[index]) {
            const file = listaFinaisCache[index];
            const url = `${WORKER}/stream?id=${encodeURIComponent(file.path)}`;
            abrir(url, file.path);
            document.getElementById('input-busca').value = '';
        }
    }

    async function carregar() {
        const params = new URLSearchParams(window.location.search);
        const configLocal = JSON.parse(localStorage.getItem('config_atual') || "{}");
        const eventoID = params.get('evento') || configLocal.nome || configLocal.id;

        if (!eventoID) return;
        
        const pastaEvento = eventoID.replace(/\s+/g, '_');
        // Nome do evento sem underlines no título
        document.getElementById('nome-evento').innerText = pastaEvento.replace(/_/g, ' ');

        try {
            const res = await fetch(`${WORKER}/listar-videos-evento?evento=${encodeURIComponent(pastaEvento)}`);
            const arquivos = await res.json();
            
            if (JSON.stringify(arquivos) !== ultimaLista) {
                ultimaLista = JSON.stringify(arquivos);
                // Filtra e armazena em cache para a busca funcionar por index
                listaFinaisCache = arquivos.filter(f => f.path.includes('final_'));
                renderizar(listaFinaisCache);
            }
        } catch (e) { console.error(e); }
    }

    function renderizar(finais) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        
        if (finais.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; opacity:0.5;'>Nenhum vídeo encontrado.</p>";
            return;
        }

        finais.forEach((file, i) => {
            const url = `${WORKER}/stream?id=${encodeURIComponent(file.path)}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="num">#${i + 1}</div>
                <video src="${url}#t=0.5" muted playsinline></video>
            `;
            card.onclick = () => abrir(url, file.path);
            grid.appendChild(card);
        });
    }

    function abrir(url, path) {
        const m = document.getElementById('modal');
        const v = document.getElementById('vid-full');
        m.style.display = "flex";
        v.src = url;
        v.play();

        document.getElementById('btn-save').onclick = () => {
            fetch(url).then(r => r.blob()).then(b => saveAs(b, path.split('/').pop()));
        };
    }

    function fechar() {
        document.getElementById('modal').style.display = "none";
        document.getElementById('vid-full').pause();
        document.getElementById('vid-full').src = "";
    }

    setInterval(carregar, 5000);
    carregar();
</script>
</body>
</html>
