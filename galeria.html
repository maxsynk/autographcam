<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --bg: #0E1A25; --surface: #182232; --accent: #69829E; --text: #EFEEE9; }
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; touch-action: manipulation; }
        body { 
            margin: 0; background: var(--bg); color: var(--text); 
            font-family: sans-serif; text-align: center; overflow: hidden;
            position: fixed; width: 100%; height: 100%; /* Impede scroll e arraste de fechamento */
        }
        .header { padding: 30px 20px 10px 20px; cursor: pointer; }
        .header h1 { font-size: 32px; letter-spacing: 4px; margin: 0; text-transform: uppercase; font-weight: 900; }
        .subtitle { font-size: 11px; letter-spacing: 4px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; color: var(--accent); }
        .event-info-container { display: flex; align-items: center; padding: 15px 20px; }
        .v-line { width: 2px; height: 30px; background: var(--accent); margin-right: 10px; }
        #nome-evento { color: var(--accent); font-size: 13px; text-transform: uppercase; font-weight: bold; text-align: left; }
        .search-area { padding: 15px; background: rgba(0,0,0,0.3); display: flex; justify-content: center; margin-bottom: 10px; }
        .search-area input { 
            width: 180px; padding: 12px; border-radius: 8px; border: 1px solid var(--accent); 
            background: #000; color: var(--accent); text-align: center; font-size: 18px; outline: none;
        }
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; height: calc(100vh - 250px); overflow-y: auto;
        }
        .card { background: var(--surface); border-radius: 12px; overflow: hidden; aspect-ratio: 9/16; position: relative; border: 1px solid rgba(105, 130, 158, 0.2); }
        .card video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .num { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; z-index: 2; }
        #modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #vid-full { width: 90%; max-height: 70vh; border-radius: 10px; }
        .btns { margin-top: 25px; display: flex; gap: 15px; }
        .btn { padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-back { background: #333; color: white; }
        .btn-dl { background: var(--accent); color: white; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header" id="titulo-trava">
        <h1>AUTOGRAPH CAM</h1>
        <div class="subtitle">colecionando momentos</div>
    </div>

    <div class="event-info-container">
        <div class="v-line"></div>
        <div id="nome-evento">SINCRONIZANDO...</div>
    </div>

    <div class="search-area">
        <input type="number" id="input-busca" placeholder="Nº VÍDEO" oninput="timerBusca()">
    </div>

    <div id="grid" class="grid"></div>

    <div id="modal">
        <video id="vid-full" controls playsinline crossorigin="anonymous"></video>
        <div class="btns">
            <button class="btn btn-back" onclick="fechar()">VOLTAR</button>
            <button id="btn-save" class="btn btn-dl">BAIXAR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaVideos = [];
    let cliquesSaida = 0;
    let idEventoAtual = "";
    let bloqueioAtivo = true;

    // --- ULTRA TRAVA DE NAVEGAÇÃO ---
    function travarSistema() {
        // Força um hash na URL para criar âncoras internas
        location.hash = "main";
        
        // Se o usuário tentar voltar, ele apenas alterna entre #main e #lock
        window.onhashchange = function() {
            if (bloqueioAtivo) {
                location.hash = "main";
            }
        };

        // Inunda o histórico de forma massiva
        for (let i = 0; i < 100; i++) {
            history.pushState(null, null, null);
        }

        window.onpopstate = function () {
            if (bloqueioAtivo) {
                history.pushState(null, null, null);
                fechar(); // Se estiver no modal, fecha
            }
        };

        // Bloqueia gestos de toque (swipe de borda no Android/iOS)
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    }

    travarSistema();

    // Saída Secreta (7 cliques)
    document.getElementById('titulo-trava').addEventListener('click', function() {
        cliquesSaida++;
        if (cliquesSaida >= 7) {
            bloqueioAtivo = false;
            alert("SISTEMA LIBERADO");
            window.onhashchange = null;
            window.onpopstate = null;
        }
        setTimeout(() => { cliquesSaida = 0; }, 3000);
    });

    // --- FUNCIONALIDADES ---
    function timerBusca() {
        clearTimeout(window.tempoBusca);
        const valor = document.getElementById('input-busca').value;
        if (valor) window.tempoBusca = setTimeout(() => executarBusca(valor), 1200);
    }

    function executarBusca(num) {
        const video = listaVideos.find((v, i) => (listaVideos.length - i) == num);
        if (video) {
            abrir(video.path);
        } else {
            alert("Não encontrado.");
        }
        document.getElementById('input-busca').value = '';
    }

    async function carregar() {
        const params = new URLSearchParams(window.location.search);
        const eventoID = params.get('evento') || JSON.parse(localStorage.getItem('config_atual') || "{}").id_fixo;
        if (!eventoID) return;
        idEventoAtual = eventoID;
        document.getElementById('nome-evento').innerText = idEventoAtual.replace(/_/g, ' ');

        try {
            const res = await fetch(`${WORKER}/listar-galeria?evento=${encodeURIComponent(idEventoAtual)}`);
            const arquivos = await res.json();
            const finais = arquivos.filter(f => f.path.toLowerCase().includes('final_')).reverse();
            if (JSON.stringify(finais) !== JSON.stringify(listaVideos)) {
                listaVideos = finais;
                renderizar();
            }
        } catch (e) {}
    }

    function renderizar() {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        listaVideos.forEach((file, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<div class="num">#${listaVideos.length - i}</div><video src="${WORKER}/stream?id=${encodeURIComponent(file.path)}#t=0.5" muted playsinline></video>`;
            card.onclick = () => abrir(file.path);
            grid.appendChild(card);
        });
    }

    function abrir(path) {
        const v = document.getElementById('vid-full');
        v.src = `${WORKER}/stream?id=${encodeURIComponent(path)}`;
        document.getElementById('modal').style.display = "flex";
        v.play();

        document.getElementById('btn-save').onclick = async () => {
            const b = await (await fetch(v.src)).blob();
            saveAs(b, path.split('/').pop());
        };
    }

    function fechar() {
        const m = document.getElementById('modal');
        if(m.style.display === "flex") {
            m.style.display = "none";
            document.getElementById('vid-full').src = "";
        }
    }

    setInterval(carregar, 5000);
    carregar();
</script>
</body>
</html>
