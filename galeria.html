<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER E ATALHO */
        .header {
            margin-top: 1.2cm;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            color: var(--accent);
            font-size: 18px;
            margin: -5px 0 0 0;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: lowercase;
            opacity: 0.9;
        }

        #nome-evento-banner {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        /* BUSCA */
        .search-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .search-container input {
            width: 100%;
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        /* GRID */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 94%;
            max-width: 1100px;
            padding-bottom: 50px;
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            border: 1px solid rgba(105, 130, 158, 0.2);
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* NUMERAÇÃO */
        .video-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
        }

        /* BOTÃO DOWNLOAD NA GRADE */
        .btn-download-grid {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--accent);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
        }

        /* MODAL ZOOM */
        #modal-zoom {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        #video-expandido {
            width: 90%;
            max-height: 70vh;
            border-radius: 10px;
        }

        .btn-fechar-zoom {
            margin-top: 20px;
            background: white;
            color: black;
            padding: 10px 30px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
        }
    </style>
</head>
<body onload="sincronizarInterface()">

    <div class="header" onclick="contarCliques()">
        <h1>AUTOGRAPH CAM</h1>
        <p>colecionando momentos</p>
        <div id="nome-evento-banner">CARREGANDO...</div>
    </div>

    <div class="search-container">
        <input type="text" id="input-busca" placeholder="Digite o número do vídeo..." oninput="iniciarBuscaInteligente()">
    </div>

    <div id="grade-videos" class="grid-videos"></div>

    <div id="modal-zoom">
        <video id="video-expandido" controls playsinline></video>
        <button class="btn-fechar-zoom" onclick="fecharZoom()">FECHAR</button>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let cliquesVoltar = 0;
    let timerBusca;

    function contarCliques() {
        cliquesVoltar++;
        if (cliquesVoltar >= 7) window.location.href = 'index.html';
        setTimeout(() => { cliquesVoltar = 0; }, 3000);
    }

    function iniciarBuscaInteligente() {
        clearTimeout(timerBusca);
        const termo = document.getElementById('input-busca').value.trim();
        if(termo.length > 0) {
            timerBusca = setTimeout(() => {
                // Tenta achar pelo número (#1, #2...) ou nome do arquivo
                const encontrado = listaArquivosAtuais.find((arq, index) => {
                    const numExibicao = listaArquivosAtuais.length - index;
                    return numExibicao.toString() === termo || arq.key.includes(termo);
                });
                if(encontrado) {
                    abrirZoom(`${WORKER_URL}/ver-video?file=${encodeURIComponent(encontrado.key)}`);
                }
            }, 3000);
        }
    }

    async function sincronizarInterface() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento') || (JSON.parse(localStorage.getItem('config_atual')) || {nome: "Geral"}).nome;
        
        document.getElementById('nome-evento-banner').innerText = "Evento: " + eventoID.toUpperCase();
        const pastaR2 = eventoID.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

        try {
            const res = await fetch(`${WORKER_URL}/listar-videos-evento?evento=${encodeURIComponent(pastaR2)}&t=${Date.now()}`);
            const dados = await res.json();
            dados.reverse(); // Novos primeiro

            if (JSON.stringify(dados) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = dados;
                renderizar(dados);
            }
        } catch (e) { console.error(e); }
    }

    function renderizar(arquivos) {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';
        arquivos.forEach((file, index) => {
            const videoUrl = `${WORKER_URL}/ver-video?file=${encodeURIComponent(file.key)}`;
            const num = arquivos.length - index;
            
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-number">#${num}</div>
                <video src="${videoUrl}#t=0.1" preload="metadata" muted playsinline onclick="abrirZoom('${videoUrl}')"></video>
                <a href="${videoUrl}" download="video_${num}.mp4" class="btn-download-grid">BAIXAR</a>
            `;
            container.appendChild(card);
        });
    }

    function abrirZoom(url) {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        vid.src = url;
        modal.style.display = 'flex';
        vid.play();
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        vid.pause();
        vid.src = "";
        modal.style.display = 'none';
        document.getElementById('input-busca').value = '';
    }

    setInterval(sincronizarInterface, 10000);
</script>
</body>
</html>
