<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER ORIGINAL RECOMPILADO */
        .header {
            width: 100%;
            padding: 40px 0 20px 0;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        #nome-evento-titulo {
            color: var(--text-main);
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .search-container {
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 15px 20px;
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        /* GRID E CARDS */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 colunas no mobile */
            gap: 12px;
            width: 94%;
            max-width: 1000px;
            padding-bottom: 50px;
        }

        @media (min-width: 768px) {
            .grid-videos { grid-template-columns: repeat(4, 1fr); }
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(105, 130, 158, 0.2);
            transition: transform 0.3s;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Para o clique cair no card */
        }

        /* MODAL DE ZOOM */
        #modal-zoom {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }

        #video-expandido {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .btn-fechar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-download-zoom {
            margin-top: 20px;
            background: var(--accent);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="nome-evento-titulo">GERAL</h1>
        <div class="search-container">
            <input type="text" id="busca" placeholder="Buscar meu vídeo..." oninput="filtrar()">
        </div>
    </div>

    <div id="grade-videos" class="grid-videos"></div>

    <!-- MODAL DE ZOOM -->
    <div id="modal-zoom" onclick="fecharZoom()">
        <button class="btn-fechar">X FECHAR</button>
        <video id="video-expandido" controls playsinline></video>
        <a id="link-download" href="#" download class="btn-download-zoom">BAIXAR VÍDEO</a>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let todosArquivos = [];

    async function carregarGaleria() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento');

        if (!eventoID) {
            const configLocal = JSON.parse(localStorage.getItem('config_atual'));
            eventoID = configLocal ? configLocal.nome : "Geral";
        }

        document.getElementById('nome-evento-titulo').innerText = eventoID.replace(/_/g, ' ');

        const pastaR2 = eventoID.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

        try {
            const res = await fetch(`${WORKER_URL}/listar-videos-evento?evento=${encodeURIComponent(pastaR2)}&t=${Date.now()}`);
            let dados = await res.json();

            // ORDEM: Mais novos primeiro (baseado no nome do arquivo se tiver timestamp)
            dados.reverse(); 

            todosArquivos = dados;
            renderizar(todosArquivos);
        } catch (e) {
            console.error("Erro:", e);
        }
    }

    function renderizar(lista) {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';

        lista.forEach(arq => {
            const videoUrl = `${WORKER_URL}/ver-video?file=${encodeURIComponent(arq.key)}`;
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <video src="${videoUrl}#t=0.1" preload="metadata" muted playsinline></video>
            `;
            card.onclick = () => abrirZoom(videoUrl);
            container.appendChild(card);
        });
    }

    function abrirZoom(url) {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        const link = document.getElementById('link-download');
        
        vid.src = url;
        link.href = url;
        modal.style.display = 'flex';
        vid.play();
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        vid.pause();
        vid.src = "";
        modal.style.display = 'none';
    }

    function filtrar() {
        const termo = document.getElementById('busca').value.toLowerCase();
        const filtrados = todosArquivos.filter(a => a.key.toLowerCase().includes(termo));
        renderizar(filtrados);
    }

    carregarGaleria();
    // Atualiza a cada 15 segundos para novos vídeos
    setInterval(carregarGaleria, 15000);
</script>
</body>
</html>
