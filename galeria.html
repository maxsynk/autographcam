<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <!-- BIBLIOTECA PARA O DOWNLOAD FUNCIONAR SEGURO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            margin-top: 1.2cm;
            text-align: center;
            margin-bottom: 25px;
            cursor: pointer;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            color: var(--accent);
            font-size: 18px;
            margin: -5px 0 0 0;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: lowercase;
            opacity: 0.9;
        }

        #nome-evento-banner {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        /* BUSCA */
        .search-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
        }

        .search-container input {
            flex: 1;
            padding: 15px;
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        .btn-busca {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }

        /* GRID */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 94%;
            max-width: 1100px;
            padding-bottom: 80px;
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            border: 1px solid rgba(105, 130, 158, 0.2);
        }

        .video-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
            z-index: 5;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        /* MODAL ZOOM */
        #modal-zoom {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        #media-full {
            width: 85%;
            max-height: 70vh;
            border-radius: 15px;
            border: 2px solid var(--accent);
        }

        .modal-controls {
            margin-top: 25px;
            display: flex;
            gap: 10px;
            width: 85%;
            justify-content: center;
        }

        .btn-action {
            padding: 15px 25px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-close { background: #333; color: white; }
        .btn-download { background: var(--accent); color: white; }

    </style>
</head>
<body>

    <div class="header" id="logo-exit">
        <h1>AUTOGRAPH CAM</h1>
        <p>colecionando momentos</p>
        <div id="nome-evento-banner">CARREGANDO...</div>
    </div>

    <div class="search-container">
        <input type="number" id="input-busca" placeholder="Nº DO VÍDEO">
        <button class="btn-busca" onclick="executarBusca()">🔍</button>
    </div>

    <div id="grade-videos" class="grid-videos"></div>

    <div id="modal-zoom">
        <video id="media-full" controls playsinline crossorigin="anonymous"></video>
        <div class="modal-controls">
            <button class="btn-action btn-close" onclick="fecharZoom()">FECHAR</button>
            <button id="btn-download-force" class="btn-action btn-download">BAIXAR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let cliquesSaida = 0;

    // SAÍDA PARA ADMIN (7 Cliques no Título)
    document.getElementById('logo-exit').onclick = () => {
        if(++cliquesSaida >= 7) window.location.href = 'index.html';
        setTimeout(() => { cliquesSaida = 0; }, 3000);
    };

    async function sincronizarInterface() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento') || (JSON.parse(localStorage.getItem('config_atual')) || {nome: "Geral"}).nome;
        
        document.getElementById('nome-evento-banner').innerText = "Evento: " + eventoID.toUpperCase().replace(/_/g, ' ');
        const pastaR2 = eventoID.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

        try {
            // USANDO O ENDPOINT DO CÓDIGO QUE VOCÊ MANDOU
            const res = await fetch(`${WORKER_URL}/listar-galeria?evento=${encodeURIComponent(pastaR2)}&t=${Date.now()}`);
            const dados = await res.json();
            
            // Filtra apenas os finais para não dar erro de renderização
            const filtrados = dados.filter(f => f.path.toLowerCase().includes('final_'));

            if (JSON.stringify(filtrados) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = filtrados;
                renderizar();
            }
        } catch (e) { console.error("Erro na lista:", e); }
    }

    function renderizar() {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';
        
        listaArquivosAtuais.forEach((file, index) => {
            // USANDO O ENDPOINT /stream QUE VOCÊ MANDOU
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            const num = index + 1;
            
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-number">#${num}</div>
                <video src="${url}#t=0.5" muted playsinline></video>
            `;
            card.onclick = () => abrirZoom(url, file.path);
            container.appendChild(card);
        });
    }

    function executarBusca() {
        const val = document.getElementById('input-busca').value;
        const index = parseInt(val) - 1;
        if (listaArquivosAtuais[index]) {
            const file = listaArquivosAtuais[index];
            const url = `${WORKER_URL}/stream?id=${encodeURIComponent(file.path)}`;
            abrirZoom(url, file.path);
        } else {
            alert("Vídeo não encontrado!");
        }
    }

    function abrirZoom(url, path) {
        const modal = document.getElementById('modal-zoom');
        const video = document.getElementById('media-full');
        modal.style.display = 'flex';
        video.src = url;
        video.play();

        // LOGICA DE DOWNLOAD DO CÓDIGO QUE FUNCIONA
        document.getElementById('btn-download-force').onclick = () => {
            fetch(url).then(r => r.blob()).then(b => {
                saveAs(b, path.split('/').pop());
            });
        };
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('media-full');
        vid.pause();
        vid.src = "";
        modal.style.display = 'none';
    }

    // Inicia e atualiza
    sincronizarInterface();
    setInterval(sincronizarInterface, 7000);
</script>
</body>
</html>
