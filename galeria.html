<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        :root { --bg: #0E1A25; --surface: #182232; --accent: #69829E; --text: #EFEEE9; }
        
        /* Bloqueia seleção de texto para evitar cópias acidentais */
        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        body { 
            margin: 0; 
            background: var(--bg); 
            color: var(--text); 
            font-family: sans-serif; 
            text-align: center; 
            overflow-x: hidden;
            overscroll-behavior-y: contain; /* Evita o "puxar para atualizar" no Android/iOS */
        }
        
        .header { padding: 30px 20px 10px 20px; }
        .header h1 { font-size: 32px; letter-spacing: 4px; margin: 0; text-transform: uppercase; font-weight: 900; }
        .subtitle { font-size: 11px; letter-spacing: 4px; opacity: 0.9; margin-top: 2px; text-transform: uppercase; color: var(--accent); }
        
        /* Estilo Evento igual Admin */
        .event-info-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 15px 20px;
        }
        .v-line { width: 2px; height: 30px; background: var(--accent); border-radius: 2px; margin-right: 10px; }
        #nome-evento { 
            color: var(--accent); 
            font-size: 13px; 
            margin: 0; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            font-weight: bold;
            text-align: left;
        }

        /* Buscador igual Admin */
        .search-area { 
            padding: 15px; 
            background: rgba(0,0,0,0.3); 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            margin-bottom: 10px;
        }
        .search-area input { 
            width: 180px; 
            padding: 12px; border-radius: 8px; 
            border: 1px solid var(--accent); background: #000; color: var(--accent); 
            text-align: center; font-weight: bold; outline: none; font-size: 18px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
            gap: 15px; padding: 20px; max-width: 1000px; margin: 0 auto; 
        }
        
        .card { 
            background: var(--surface); border-radius: 12px; overflow: hidden; 
            aspect-ratio: 9/16; position: relative; border: 1px solid rgba(105, 130, 158, 0.2); 
        }
        
        .card video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .num { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }

        /* MODAL */
        #modal { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #vid-full { width: 90%; max-height: 70vh; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btns { margin-top: 25px; display: flex; gap: 15px; }
        .btn { padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 13px; }
        .btn-back { background: #333; color: white; }
        .btn-dl { background: var(--accent); color: white; }
    </style>
</head>
<body oncontextmenu="return false;"> <div class="header" onclick="contarCliquesSair()">
        <h1>AUTOGRAPH CAM</h1>
        <div class="subtitle">colecionando momentos</div>
    </div>

    <div class="event-info-container">
        <div class="v-line"></div>
        <div id="nome-evento">SINCRONIZANDO...</div>
    </div>

    <div class="search-area">
        <input type="number" id="input-busca" placeholder="Nº VÍDEO" oninput="timerBusca()">
    </div>

    <div id="grid" class="grid"></div>

    <div id="modal">
        <video id="vid-full" controls playsinline crossorigin="anonymous"></video>
        <div class="btns">
            <button class="btn btn-back" onclick="fechar()">VOLTAR</button>
            <button id="btn-save" class="btn btn-dl">BAIXAR VÍDEO</button>
        </div>
    </div>

<script>
    const WORKER = "https://autographcam.maxprimefotovideo.workers.dev";
    let ultimaLista = "";
    let listaFinaisCache = [];
    let cliquesSaida = 0;
    let tempoBusca;
    let bloqueioAtivo = true;

    // --- SISTEMA DE BLOQUEIO ANTI-SAÍDA (ANDROID & IPHONE) ---
    function iniciarBloqueio() {
        // Empurra estado inicial
        history.pushState(null, null, window.location.href);
        
        // Bloqueia botão voltar (Android e Navegadores)
        window.onpopstate = function() {
            if (bloqueioAtivo) {
                history.pushState(null, null, window.location.href);
            }
        };

        // Bloqueia gesto de "Swipe" (arrastar da borda) no iPhone
        window.addEventListener('touchstart', function(e) {
            if (bloqueioAtivo && e.pageX < 40) { // Detecta toque na borda esquerda
                e.preventDefault();
            }
        }, { passive: false });
    }

    // Inicia a trava imediatamente
    iniciarBloqueio();

    // Atalho Secreto: 7 cliques no título para voltar
    function contarCliquesSair() {
        cliquesSaida++;
        if (cliquesSaida >= 7) {
            bloqueioAtivo = false;
            window.location.href = 'index.html';
        }
        setTimeout(() => { cliquesSaida = 0; }, 3000);
    }

    // Buscador automático de 3 segundos
    function timerBusca() {
        clearTimeout(tempoBusca);
        const valor = document.getElementById('input-busca').value;
        if (valor) {
            tempoBusca = setTimeout(() => {
                executarBusca(valor);
            }, 3000);
        }
    }

    function executarBusca(num) {
        const index = parseInt(num) - 1;
        if (listaFinaisCache[index]) {
            const file = listaFinaisCache[index];
            const url = `${WORKER}/stream?id=${encodeURIComponent(file.path)}`;
            abrir(url, file.path);
            document.getElementById('input-busca').value = '';
        } else if (num !== "") {
            alert("Vídeo #" + num + " não encontrado.");
            document.getElementById('input-busca').value = '';
        }
    }

    async function carregar() {
        const params = new URLSearchParams(window.location.search);
        const configLocal = JSON.parse(localStorage.getItem('config_atual') || "{}");
        const eventoID = params.get('evento') || configLocal.nome || configLocal.id;

        if (!eventoID) return;
        
        const pastaEvento = eventoID.replace(/\s+/g, '_');
        document.getElementById('nome-evento').innerText = pastaEvento.replace(/_/g, ' ');

        try {
            const res = await fetch(`${WORKER}/listar-videos-evento?evento=${encodeURIComponent(pastaEvento)}`);
            const arquivos = await res.json();
            
            // Filtra apenas os finalizados pelo motor Python
            const apenasFinais = arquivos.filter(f => f.path.includes('final_'));

            if (JSON.stringify(apenasFinais) !== ultimaLista) {
                ultimaLista = JSON.stringify(apenasFinais);
                listaFinaisCache = apenasFinais;
                renderizar(apenasFinais);
            }
        } catch (e) { console.error("Erro na sincronização."); }
    }

    function renderizar(finais) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        
        if (finais.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; opacity:0.5; margin-top:50px;'>Aguardando vídeos serem processados...</p>";
            return;
        }

        finais.forEach((file, i) => {
            const url = `${WORKER}/stream?id=${encodeURIComponent(file.path)}`;
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="num">#${i + 1}</div>
                <video src="${url}#t=0.5" muted playsinline></video>
            `;
            card.onclick = () => abrir(url, file.path);
            grid.appendChild(card);
        });
    }

    function abrir(url, path) {
        const m = document.getElementById('modal');
        const v = document.getElementById('vid-full');
        m.style.display = "flex";
        v.src = url;
        v.play();

        document.getElementById('btn-save').onclick = () => {
            const btn = document.getElementById('btn-save');
            btn.innerText = "BAIXANDO...";
            fetch(url)
                .then(r => r.blob())
                .then(b => {
                    saveAs(b, path.split('/').pop());
                    btn.innerText = "BAIXAR VÍDEO";
                })
                .catch(() => {
                    alert("Erro ao baixar. Tente novamente.");
                    btn.innerText = "BAIXAR VÍDEO";
                });
        };
    }

    function fechar() {
        document.getElementById('modal').style.display = "none";
        const v = document.getElementById('vid-full');
        v.pause();
        v.src = "";
    }

    // Inicialização
    setInterval(carregar, 5000);
    carregar();
</script>
</body>
</html>
