<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CENTRAL - AUTOGRAPH CAM</title>
    <style>
        :root { 
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body { 
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main); 
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header { margin-top: 1.8cm; text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 42px; font-weight: 900; letter-spacing: 3px; margin: 0; text-transform: uppercase; color: var(--text-main); }
        .header p { color: var(--accent); font-size: 18px; margin: 0; letter-spacing: 4px; }

        .main-container { width: 92%; max-width: 500px; }

        .btn-central {
            width: 100%; padding: 20px; margin: 10px 0; border-radius: 12px;
            text-transform: uppercase; font-weight: 800; cursor: pointer;
            text-decoration: none; text-align: center; display: none; box-sizing: border-box;
            border: none; transition: 0.3s;
        }

        #btn-login { display: block; background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        #btn-create { background: var(--accent); color: var(--text-main); }
        #btn-admin, #btn-galeria, #btn-copy-link { background: rgba(105, 130, 158, 0.1); color: var(--accent); border: 1px solid var(--accent); }

        .event-list-container { width: 100%; margin-top: 30px; display: none; }
        .event-card {
            background: var(--bg-surface); padding: 15px; border-radius: 15px;
            margin-bottom: 15px; display: grid; grid-template-columns: 1fr 80px; gap: 10px;
            border: 2px solid transparent;
        }
        .event-card.active-border { border-color: var(--accent); }

        .event-info h4 { margin: 0; text-transform: uppercase; }
        .event-info span { font-size: 12px; color: var(--text-dim); }

        .group-actions-row { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .status-btn, .btn-edit-big, .btn-gallery-big { padding: 8px; border-radius: 8px; font-size: 10px; font-weight: 900; cursor: pointer; border: none; }
        .btn-is-on { background: #2ECC71; color: #fff; }
        .btn-is-off { background: #34495E; color: #BDC3C7; }
        .btn-edit-big { background: #2A3A4A; color: #fff; }
        .btn-gallery-big { background: var(--accent); color: #fff; }
        .btn-del-big { background: rgba(255, 85, 85, 0.2); color: #ff5555; width: 30px; border-radius: 8px; border: none; cursor: pointer; }

        .btn-camera-main { background: var(--accent); font-size: 30px; border-radius: 12px; border: none; cursor: pointer; }
        .btn-camera-main:disabled { opacity: 0.3; cursor: not-allowed; }

        #modal-senha { position: fixed; inset: 0; background: rgba(14, 26, 37, 0.98); display: none; align-items: center; justify-content: center; z-index: 999; }
        .modal-content { background: var(--bg-surface); padding: 30px; border-radius: 20px; text-align: center; width: 80%; }
        .modal-content input { width: 100%; padding: 15px; margin-bottom: 20px; background: #000; border: 1px solid var(--accent); color: #fff; text-align: center; font-size: 20px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>AUTOGRAPH CAM</h1>
        <p>colecionando momentos</p>
    </div>

    <div class="main-container">
        <button id="btn-login" class="btn-central" onclick="abrirModal()">🔓 ACESSAR SISTEMA</button>
        <a href="config_evento.html" id="btn-create" class="btn-protected btn-central">➕ CRIAR NOVO EVENTO</a>
        <a href="galeria_admin.html" id="btn-admin" class="btn-protected btn-central">👑 GALERIA ADMIN</a>
        <button id="btn-copy-link" class="btn-protected btn-central" onclick="copiarLinkCliente()">🔗 COPIAR LINK CLIENTE</button>

        <div id="container-eventos" class="event-list-container">
            <div id="lista-eventos"></div>
        </div>

        <button id="btn-lock" class="btn-protected btn-central" onclick="bloquear()" style="color: #ff5555; background: none; font-size: 12px;">SAIR DO SISTEMA</button>
    </div>

    <div id="modal-senha">
        <div class="modal-content">
            <h3>SENHA MESTRA</h3>
            <input type="password" id="input-senha" inputmode="numeric" placeholder="••••">
            <button style="width:100%; padding:15px; background:var(--accent); border:none; color:#fff; border-radius:10px;" onclick="validarSenha()">ENTRAR</button>
        </div>
    </div>

<script>
    const SENHA_MESTRA = "1234"; 
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";

    window.onload = () => { if(sessionStorage.getItem('logado') === 'true') liberarSistema(); };

    function abrirModal() { document.getElementById('modal-senha').style.display = 'flex'; }
    function liberarSistema() {
        document.getElementById('btn-login').style.display = 'none';
        document.querySelectorAll('.btn-protected').forEach(b => b.style.display = 'block');
        document.getElementById('container-eventos').style.display = 'block';
        renderEventos();
    }

    function validarSenha() {
        if (document.getElementById('input-senha').value === SENHA_MESTRA) {
            sessionStorage.setItem('logado', 'true');
            document.getElementById('modal-senha').style.display = 'none';
            liberarSistema();
        } else { alert("Senha Incorreta"); }
    }

    async function renderEventos() {
        const container = document.getElementById('lista-eventos');
        const ativo = JSON.parse(localStorage.getItem('config_atual'));
        
        try {
            const res = await fetch(`${WORKER_URL}/listar-eventos?t=${Date.now()}`);
            const eventos = await res.json();
            
            if(!eventos.length) { container.innerHTML = "<p>Nenhum evento cadastrado.</p>"; return; }

            container.innerHTML = '';
            eventos.forEach(ev => {
                const estaAtivo = ativo && ativo.id == ev.id;
                const card = document.createElement('div');
                card.className = `event-card ${estaAtivo ? 'active-border' : ''}`;
                card.innerHTML = `
                    <div class="event-info">
                        <h4>${ev.nome}</h4>
                        <span>DATA: ${ev.data}</span>
                        <div class="group-actions-row">
                            <button class="status-btn ${estaAtivo ? 'btn-is-on' : 'btn-is-off'}" onclick='alternar("${ev.id}")'>${estaAtivo ? 'ATIVO' : 'ATIVAR'}</button>
                            <button class="btn-del-big" onclick="excluir('${ev.id}')">×</button>
                        </div>
                    </div>
                    <button class="btn-camera-main" ${estaAtivo ? '' : 'disabled'} onclick='abrirCam()'>📸</button>
                `;
                container.appendChild(card);
            });
        } catch (e) { container.innerHTML = "Erro ao carregar."; }
    }

    function alternar(id) {
        // Busca o evento na lista local para ativar
        fetch(`${WORKER_URL}/listar-eventos`).then(r => r.json()).then(evs => {
            const ev = evs.find(x => x.id == id);
            localStorage.setItem('config_atual', JSON.stringify(ev));
            renderEventos();
        });
    }

    async function excluir(id) {
        if(!confirm("Excluir evento?")) return;
        await fetch(`${WORKER_URL}/deletar-evento`, {
            method: 'POST',
            body: JSON.stringify({ evento_id: id })
        });
        renderEventos();
    }

    function abrirCam() { window.location.href = 'camera.html'; }
    function bloquear() { sessionStorage.removeItem('logado'); location.reload(); }
    function copiarLinkCliente() {
        const config = JSON.parse(localStorage.getItem('config_atual'));
        if (!config) return alert("Ative um evento!");
        const link = `https://maxsynk.github.io/autographcam/galeria.html?evento=${config.id_fixo}`;
        navigator.clipboard.writeText(link).then(() => alert("Link Copiado!"));
    }
</script>
</body>
</html>
