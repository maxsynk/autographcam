<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GALERIA - AUTOGRAPH CAM</title>
    <style>
        :root {
            --bg-deep: #0E1A25;
            --bg-surface: #182232;
            --accent: #69829E;
            --text-main: #EFEEE9;
            --text-dim: #A0B0C0;
        }

        body {
            margin: 0;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* HEADER ESTILO CENTRAL */
        .header {
            margin-top: 1.2cm;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer; /* Indica que é clicável para o atalho */
            user-select: none;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0;
            text-transform: uppercase;
        }

        .header p {
            color: var(--accent);
            font-size: 18px;
            margin: -5px 0 0 0;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: lowercase;
            opacity: 0.9;
        }

        #nome-evento-banner {
            font-size: 12px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }

        /* BUSCA */
        .search-container {
            width: 90%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .search-container input {
            width: 100%;
            padding: 15px 25px;
            background: var(--bg-surface);
            border: 1px solid var(--accent);
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-sizing: border-box;
        }

        /* GRID */
        .grid-videos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            width: 94%;
            max-width: 1000px;
            padding-bottom: 40px;
        }

        .video-card {
            background: var(--bg-surface);
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 9/16;
            position: relative;
            border: 1px solid rgba(105, 130, 158, 0.1);
            cursor: pointer;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* MODAL ZOOM */
        #modal-zoom {
            position: fixed;
            inset: 0;
            background: rgba(14, 26, 37, 0.98);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(10px);
        }

        #video-expandido {
            width: 90%;
            max-height: 75vh;
            border-radius: 15px;
            border: 1px solid var(--accent);
        }

        .btn-fechar {
            margin-top: 20px;
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--text-dim);
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
        }

        .btn-download-zoom {
            margin-top: 15px;
            background: var(--accent);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
        }

        .empty-msg {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: var(--text-dim);
            opacity: 0.6;
        }
    </style>
</head>
<body onload="sincronizarInterface()">

    <div class="header" onclick="contarCliques()">
        <h1>AUTOGRAPH CAM</h1>
        <p>colecionando momentos</p>
        <div id="nome-evento-banner">CARREGANDO EVENTO...</div>
    </div>

    <div class="search-container">
        <input type="text" id="input-busca" placeholder="Digite o número do seu vídeo..." oninput="iniciarBuscaInteligente()">
    </div>

    <div id="grade-videos" class="grid-videos"></div>

    <!-- MODAL DE ZOOM -->
    <div id="modal-zoom">
        <video id="video-expandido" controls playsinline></video>
        <a id="link-download" href="#" download class="btn-download-zoom">BAIXAR MEU VÍDEO</a>
        <button class="btn-fechar" onclick="fecharZoom()">FECHAR</button>
    </div>

<script>
    const WORKER_URL = "https://autographcam.maxprimefotovideo.workers.dev";
    let listaArquivosAtuais = [];
    let cliquesVoltar = 0;
    let timerBusca;

    // 1. Atalho Secreto (7 cliques no título)
    function contarCliques() {
        cliquesVoltar++;
        if (cliquesVoltar >= 7) {
            window.location.href = 'index.html';
        }
        setTimeout(() => { cliquesVoltar = 0; }, 3000); // Reseta se demorar a clicar
    }

    // 2. Busca Inteligente (Aguarda 3s e abre zoom)
    function iniciarBuscaInteligente() {
        clearTimeout(timerBusca);
        const termo = document.getElementById('input-busca').value.trim();
        
        if(termo.length > 0) {
            timerBusca = setTimeout(() => {
                const encontrado = listaArquivosAtuais.find(arq => arq.key.toLowerCase().includes(termo.toLowerCase()));
                if(encontrado) {
                    const videoUrl = `${WORKER_URL}/ver-video?file=${encodeURIComponent(encontrado.key)}`;
                    abrirZoom(videoUrl);
                }
            }, 3000);
        }
    }

    async function sincronizarInterface() {
        const urlParams = new URLSearchParams(window.location.search);
        let eventoID = urlParams.get('evento');

        if (!eventoID) {
            const configLocal = JSON.parse(localStorage.getItem('config_atual'));
            eventoID = configLocal ? configLocal.nome : "Geral";
        }

        document.getElementById('nome-evento-banner').innerText = "Evento: " + eventoID.toUpperCase().replace(/_/g, ' ');

        const pastaR2 = eventoID.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_');

        try {
            const res = await fetch(`${WORKER_URL}/listar-videos-evento?evento=${encodeURIComponent(pastaR2)}&t=${Date.now()}`);
            const novosArquivos = await res.json();

            // Inverter para mostrar os mais recentes primeiro
            novosArquivos.reverse();

            if (JSON.stringify(novosArquivos) !== JSON.stringify(listaArquivosAtuais)) {
                listaArquivosAtuais = novosArquivos;
                renderizar(novosArquivos);
            }
        } catch (e) {
            console.error("Erro ao buscar vídeos:", e);
        }
    }

    function renderizar(arquivos) {
        const container = document.getElementById('grade-videos');
        container.innerHTML = '';

        if (!arquivos || arquivos.length === 0) {
            container.innerHTML = `<div class="empty-msg">Aguardando os primeiros vídeos...</div>`;
            return;
        }

        arquivos.forEach(file => {
            const videoUrl = `${WORKER_URL}/ver-video?file=${encodeURIComponent(file.key)}`;
            const card = document.createElement('div');
            card.className = 'video-card';
            
            // O truque do #t=0.1 garante que o vídeo mostre uma imagem inicial e não fique preto
            card.innerHTML = `<video src="${videoUrl}#t=0.1" preload="metadata" muted playsinline></video>`;

            card.onclick = () => abrirZoom(videoUrl);
            container.appendChild(card);
        });
    }

    function abrirZoom(url) {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        const link = document.getElementById('link-download');
        
        vid.src = url;
        link.href = url;
        modal.style.display = 'flex';
        vid.play();
    }

    function fecharZoom() {
        const modal = document.getElementById('modal-zoom');
        const vid = document.getElementById('video-expandido');
        vid.pause();
        vid.src = "";
        modal.style.display = 'none';
        document.getElementById('input-busca').value = ''; // Limpa busca ao fechar
    }

    // Atualização automática
    setInterval(sincronizarInterface, 10000);
</script>
</body>
</html>
